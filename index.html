<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Class Behavior Tracker</title>

  <link rel="stylesheet" href="style.css?v=30">
</head>

<body>

<div class="app">

  <header>
    <h1>Class Behavior Tracker</h1>
    <p>Student Behavior & Performance Management</p>
  </header>

  <main>

    <!-- LOGIN -->
    <div id="login-screen" class="card">

      <h2>Teacher Login</h2>

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
      >

      <button type="button" id="login-btn">
        Login
      </button>

      <p id="login-message"></p>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">

      <div class="dashboard-header">

        <div>
          <h2>Teacher Dashboard</h2>
          <p id="teacher-email"></p>
          <p>Select a class to start.</p>
        </div>

        <button type="button" id="logout-btn">
          Logout
        </button>

      </div>


      <div class="class-grid">

        <button
          type="button"
          class="class-card"
          data-class="7/A"
        >
          <strong>7/A</strong>
          <span>18 Students</span>
        </button>

        <button
          type="button"
          class="class-card"
          data-class="7/B"
        >
          <strong>7/B</strong>
          <span>24 Students</span>
        </button>

      </div>

    </div>


    <!-- CLASS SCREEN -->
    <div id="class-screen" class="hidden">

      <div class="class-header">

        <button
          type="button"
          id="back-btn"
        >
          ← Back to Classes
        </button>

        <div>
          <h2 id="class-title">Class</h2>
          <p id="class-count"></p>
        </div>

      </div>


      <div id="students-list"></div>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./app.js?v=30"></script>

</body>
</html>
