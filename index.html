<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Class Behavior Tracker</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <div class="app">

    <!-- HEADER -->
    <header>

      <h1>Class Behavior Tracker</h1>

      <p>
        Student Behavior & Performance Management
      </p>

    </header>


    <main>

      <!-- =========================
           LOGIN SCREEN
      ========================== -->

      <div id="login-screen" class="card">

        <h2>Teacher Login</h2>


        <label for="email">
          Username
        </label>

        <input
          type="text"
          id="email"
          placeholder="Enter your username"
          autocomplete="username"
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >


        <button id="login-btn">
          Login
        </button>


        <p id="login-message"></p>

      </div>



      <!-- =========================
           TEACHER DASHBOARD
      ========================== -->

      <div id="dashboard" class="hidden">


        <div class="dashboard-header">

          <div>

            <h2>
              Teacher Dashboard
            </h2>

            <p id="teacher-email"></p>

            <p>
              Select a class to start.
            </p>

          </div>


          <button id="logout-btn">
            Logout
          </button>

        </div>



        <!-- =========================
             CLASSES
        ========================== -->

        <div class="class-grid">


          <!-- CLASS 7/A -->

          <button
            class="class-card"
            data-class="7/A"
          >

            <strong>
              7/A
            </strong>

            <span>
              20 Students
            </span>

          </button>



          <!-- CLASS 7/B -->

          <button
            class="class-card"
            data-class="7/B"
          >

            <strong>
              7/B
            </strong>

            <span>
              24 Students
            </span>

          </button>


        </div>

      </div>

    </main>

  </div>



  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!-- APPLICATION -->

  <script src="app.js?v=10"></script>


</body>

</html>
